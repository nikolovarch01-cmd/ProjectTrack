<!doctype html>
<html lang="bg">
<meta charset="utf-8">
<title>ProjectTrack</title>
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#1f4f9a">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="ProjectTrack">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="pt-build" content="2026-11-11b">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Onest:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" media="print" onload="this.media='all'">
<style>
/* Layout: one working column - summary tiles, "what waits" list, then project cards; a card opens into plots x specialities and plots x steps grids. */
:root{
  --bg:#eef1f4; --surface:#ffffff; --sunk:#f6f8fa; --ink:#17212b; --muted:#5a6673; --faint:#8a95a1; --line:#d9dfe5;
  --accent:#1f4f9a; --accent-bg:#e3ecf8;
  --late:#b3261e; --late-bg:#fbe7e5; --soon:#8a5a00; --soon-bg:#fdf0d5; --ok:#246b3a; --ok-bg:#e2f2e6;
  --fix:#6b3fa0; --fix-bg:#efe6fa; --go:#0b6b78; --go-bg:#dcf2f4; --skip:#7d8794; --skip-bg:#eceff2;
  --f-body:"Onest",system-ui,-apple-system,"Segoe UI",sans-serif; --f-mono:"JetBrains Mono",ui-monospace,Consolas,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#12171d; --surface:#1b222a; --sunk:#161c23; --ink:#e6ebf0; --muted:#a3adb8; --faint:#77828e; --line:#2c3540;
  --accent:#8fb4ee; --accent-bg:#1f3150;
  --late:#ff9b92; --late-bg:#41201e; --soon:#f2c46b; --soon-bg:#3a2e14; --ok:#8fd3a2; --ok-bg:#1b3324;
  --fix:#cdb0f2; --fix-bg:#33264a; --go:#7fd6e0; --go-bg:#173a3f; --skip:#98a2ad; --skip-bg:#262d35; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#12171d; --surface:#1b222a; --sunk:#161c23; --ink:#e6ebf0; --muted:#a3adb8; --faint:#77828e; --line:#2c3540;
  --accent:#8fb4ee; --accent-bg:#1f3150;
  --late:#ff9b92; --late-bg:#41201e; --soon:#f2c46b; --soon-bg:#3a2e14; --ok:#8fd3a2; --ok-bg:#1b3324;
  --fix:#cdb0f2; --fix-bg:#33264a; --go:#7fd6e0; --go-bg:#173a3f; --skip:#98a2ad; --skip-bg:#262d35; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.45;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:16px 48px}
.wrap{max-width:1100px;margin:0 auto;display:flex;flex-direction:column;gap:18px}
h1{font-size:22px;font-weight:600;margin:0;letter-spacing:-.01em}
h2{font-size:13px;font-weight:600;margin:0;text-transform:uppercase;letter-spacing:.06em;color:var(--muted)}
.mono{font-family:var(--f-mono);font-variant-numeric:tabular-nums}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:7px 12px}
button:hover{border-color:var(--faint)}
button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible,.card-head:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
button.primary{background:var(--accent);border-color:var(--accent);color:var(--surface);font-weight:500}
button.ghost{background:transparent;border-color:transparent;color:var(--muted)}
button.danger,.danger{color:var(--late)}
input,select,textarea{background:var(--sunk);border:1px solid var(--line);border-radius:8px;padding:6px 9px;min-width:0;width:100%}
textarea{resize:vertical;min-height:38px}
label.f{display:flex;flex-direction:column;gap:3px;font-size:12px;color:var(--muted);min-width:0}
.top{display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:space-between;
  position:sticky;top:0;z-index:20;background:var(--bg);padding:max(8px,env(safe-area-inset-top,0px)) 0 8px;margin-top:-8px}
/* feels like an app on the phone: no bounce, no zoom, no blue flash on tap (like the assembly app) */
html,body{overscroll-behavior:none;-webkit-tap-highlight-color:transparent;-webkit-text-size-adjust:100%}
button,.card-head,.fadd{-webkit-user-select:none;user-select:none;touch-action:manipulation}
/* phone: the page is pinned to the screen like the assembly app - no sliding sideways, no zoom;
   only the list scrolls up and down; the PC keeps the normal browser behaviour */
@media (pointer:coarse){
  html{position:fixed;inset:0;overflow:hidden;width:100%;height:100%}
  body{position:absolute;inset:0;overflow-x:hidden;overflow-y:auto;-webkit-overflow-scrolling:touch;
    overscroll-behavior:contain;touch-action:pan-x pan-y}
  input,select,textarea{font-size:16px}
  .top{position:static}
}
.top .right{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.today{color:var(--muted);font-size:13px}
#search{width:240px;max-width:100%}
.banner{padding:9px 12px;border-radius:8px;background:var(--soon-bg);color:var(--soon);font-size:13px}
.tiles{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px}
@media (max-width:700px){.tiles{grid-template-columns:repeat(2,minmax(0,1fr))}}
.tile{text-align:left;border-radius:10px;padding:10px 12px;display:flex;flex-direction:column;gap:2px;border:1px solid transparent}
.tile .n{font-size:26px;font-weight:600;line-height:1.1}
.tile .l{font-size:13px}
.tile[aria-pressed="true"]{border-color:currentColor;box-shadow:inset 0 0 0 1px currentColor}
.t-late{background:var(--late-bg);color:var(--late)} .t-soon{background:var(--soon-bg);color:var(--soon)}
.t-fix{background:var(--fix-bg);color:var(--fix)} .t-go{background:var(--go-bg);color:var(--go)}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px 14px;display:flex;flex-direction:column;gap:8px}
.panel-head{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap}
.wait-row{display:grid;grid-template-columns:96px minmax(0,1fr) auto;gap:10px;align-items:center;padding:7px 0;border-top:1px solid var(--line);cursor:pointer;background:none;border-left:0;border-right:0;border-bottom:0;border-radius:0;text-align:left;width:100%}
.wait-row:first-child{border-top:0}
.wait-row .who{min-width:0}
.wait-row .who b{font-weight:500}
.wait-row .who span{color:var(--muted)}
.pcard{display:grid;grid-template-columns:40px repeat(3,minmax(0,1fr)) auto auto;gap:8px;align-items:end;padding:6px 8px;width:100%}
.pcard b{align-self:center}
@media (max-width:760px){.pcard{grid-template-columns:40px minmax(0,1fr) auto}.pcard label.f{grid-column:2/-1}}
.row2{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.6fr);gap:12px;align-items:center}
@media (max-width:700px){.row2{grid-template-columns:minmax(0,1fr)}}
.pls{display:flex;flex-direction:column;gap:6px}
.pl{display:grid;grid-template-columns:44px auto minmax(0,1fr);gap:10px;align-items:center;font-size:14px}
.pl .last{min-width:0;color:var(--muted)}
@media (max-width:480px){.pl{grid-template-columns:40px minmax(0,1fr)}.pl .last{grid-column:2}}
.tabs{display:flex;gap:4px;border-bottom:1px solid var(--line)}
.tabs button{border:0;border-radius:8px 8px 0 0;background:transparent;color:var(--muted);padding:8px 14px;font-weight:500}
.tabs button[aria-selected="true"]{background:var(--surface);color:var(--ink);box-shadow:inset 0 -2px 0 var(--accent)}
table.st{border-collapse:collapse;width:100%;font-size:14px}
table.st th{text-align:left;font-size:12px;font-weight:500;color:var(--muted);padding:4px 8px;border-bottom:1px solid var(--line);white-space:nowrap}
table.st td{padding:6px 8px;border-bottom:1px solid var(--line);vertical-align:top}
table.st tbody tr{cursor:pointer}
table.st tbody tr:hover{background:var(--sunk)}
table.st td.mono{white-space:nowrap}
.arch{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:10px}
.archc{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:8px 10px;display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
.archc .ttl{grid-column:1/-1;font-family:var(--f-mono);font-weight:500}
.archc .wide{grid-column:1/-1}
.stage{display:flex;gap:2px;grid-column:1/-1}
.stage i{flex:1;height:6px;border-radius:3px;background:var(--skip-bg)}
.stage i.on{background:var(--accent)}
.cell.c-sent{background:var(--accent-bg);color:var(--accent);border-color:transparent}
.cell.c-back{background:var(--fix-bg);color:var(--fix);border-color:transparent}
.tel{color:var(--accent);text-decoration:none;font-family:var(--f-mono);white-space:nowrap}
.balls{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:18px}
@media (max-width:820px){.balls{grid-template-columns:minmax(0,1fr)}}
.bcol{min-width:0;display:flex;flex-direction:column}
.bhead{padding-bottom:4px;border-bottom:2px solid var(--ink);margin-bottom:2px}
.pill{display:inline-block;font-size:12px;padding:2px 8px;border-radius:999px;white-space:nowrap}
.p-late{background:var(--late-bg);color:var(--late)} .p-soon{background:var(--soon-bg);color:var(--soon)}
.p-fix{background:var(--fix-bg);color:var(--fix)} .p-ok{background:var(--ok-bg);color:var(--ok)}
.p-wait{background:var(--accent-bg);color:var(--accent)} .p-not{background:var(--skip-bg);color:var(--muted)}
.p-skip{background:var(--skip-bg);color:var(--skip)} .p-go{background:var(--go-bg);color:var(--go)}
.empty{color:var(--muted);font-size:14px;padding:4px 0}
.list{display:flex;flex-direction:column;gap:10px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:12px;overflow:hidden}
.card-head{display:flex;flex-direction:column;gap:8px;padding:12px 14px;cursor:pointer}
.card-top{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap}
.card-head .name{font-size:17px;font-weight:600}
.card-head .meta{color:var(--muted);font-size:13px;overflow-wrap:anywhere}
.flags{display:flex;gap:4px;flex-wrap:wrap;align-items:flex-start}
.plotline{display:grid;grid-template-columns:52px minmax(0,1fr) auto;gap:10px;align-items:center;font-size:13px}
.plotline .forecast{color:var(--muted);font-size:12px;text-align:right}
@media (max-width:560px){.plotline{grid-template-columns:44px minmax(0,1fr)}.plotline .forecast{grid-column:1/-1;text-align:left}}
.track{display:flex;gap:3px}
.track i{flex:1;height:8px;border-radius:3px;background:var(--skip-bg)}
.track i.s-done{background:var(--ok)} .track i.s-late{background:var(--late)} .track i.s-soon{background:var(--soon)}
.track i.s-wait{background:var(--accent)} .track i.s-fix{background:var(--fix)} .track i.s-go{background:var(--go);opacity:.55}
.track i.s-skip{background:repeating-linear-gradient(45deg,var(--skip-bg) 0 3px,transparent 3px 6px)}
.ed{border-top:1px solid var(--line);padding:12px 14px 14px;display:flex;flex-direction:column;gap:16px;background:var(--sunk)}
.ed input,.ed select,.ed textarea{background:var(--surface)}
.grid4{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px}
@media (max-width:760px){.grid4{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media (max-width:420px){.grid4{grid-template-columns:minmax(0,1fr)}}
.check{display:flex;gap:6px;align-items:center;font-size:13px}
.check input{width:auto}
.plots{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.plot{display:flex;gap:8px;align-items:center;background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:4px 4px 4px 10px}
.plot b{font-family:var(--f-mono);font-weight:500}
.mx-wrap{overflow-x:auto;max-width:100%}
.mx{border-collapse:separate;border-spacing:0;background:var(--surface);border:1px solid var(--line);border-radius:10px}
.mx th,.mx td{border-bottom:1px solid var(--line);padding:4px 6px;text-align:center;white-space:nowrap;vertical-align:middle}
.mx th{font-weight:500;font-size:14px;border-left:1px solid var(--line)}
.mx td{border-left:1px solid var(--line)}
.mx td.sn,.mx th.sn{text-align:left;font-size:14px;border-left:0;padding:4px 6px 4px 10px;white-space:normal;min-width:150px}
.mx td.sn small{display:block;color:var(--faint);font-size:11px}
.mx tr:last-child td{border-bottom:0}
.mx .x{padding:0 6px;font-size:14px}
.cell{width:46px;height:34px;padding:0;font-size:18px;font-weight:600;border-radius:6px}
.cell.c-not{background:var(--sunk)} .cell.c-work{background:var(--soon-bg);color:var(--soon);border-color:transparent}
.cell.c-ready{background:var(--ok-bg);color:var(--ok);border-color:transparent}
.sc{min-width:108px;padding:4px 8px;border-radius:7px;font-size:12px;line-height:1.25;border:1px solid transparent;text-align:left}
.sc b{display:block;font-weight:600}
.sc.sel{outline:2px solid var(--ink);outline-offset:1px}
.sc.k-done{background:var(--ok-bg);color:var(--ok)} .sc.k-late{background:var(--late-bg);color:var(--late)}
.sc.k-soon{background:var(--soon-bg);color:var(--soon)} .sc.k-wait{background:var(--accent-bg);color:var(--accent)}
.sc.k-fix{background:var(--fix-bg);color:var(--fix)} .sc.k-go{background:var(--go-bg);color:var(--go)}
.sc.k-not{background:var(--sunk);color:var(--muted);border-color:var(--line)} .sc.k-skip{background:transparent;color:var(--skip);border:1px dashed var(--line)}
.sc.h-no{background:var(--late-bg);color:var(--late)} .sc.h-asked{background:var(--soon-bg);color:var(--soon)}
.sc.h-orig{background:var(--ok-bg);color:var(--ok)} .sc.h-copy{background:var(--accent-bg);color:var(--accent)}
.sc span{display:block}
/* the project's own papers: one row of tiles on top of the opened project */
.cpanel{display:flex;flex-direction:column;gap:8px;padding-bottom:12px;border-bottom:1px solid var(--line)}
.cdocs{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:8px}
@media (max-width:600px){.cdocs{grid-template-columns:repeat(2,1fr)}}
.cdoc{display:flex;flex-direction:column;align-items:flex-start;gap:2px;text-align:left;padding:8px 10px;border-radius:10px;border:1px solid transparent;font-size:12px;line-height:1.3;min-width:0}
.cdoc b{font-size:14px;font-weight:600}
.cdoc.h-no{background:var(--late-bg);color:var(--late)} .cdoc.h-asked{background:var(--soon-bg);color:var(--soon)}
.cdoc.h-orig{background:var(--ok-bg);color:var(--ok)} .cdoc.h-copy{background:var(--accent-bg);color:var(--accent)}
.cdoc.sel{border-color:var(--ink)} .cdoc .nf{opacity:.75}
.capp{display:flex;flex-wrap:wrap;gap:6px 16px;align-items:center} .capp .check{font-size:14px} .capp .off{color:var(--faint)}
.cadd{display:flex;gap:4px;align-items:center;grid-column:1/-1;max-width:360px} .cadd input{min-width:0}
.files{display:flex;flex-wrap:wrap;gap:8px;align-items:flex-start}
.file{display:flex;flex-direction:column;gap:2px;width:108px;font-size:12px;position:relative}
.file img,.fpdf{width:108px;height:80px;object-fit:cover;border-radius:6px;border:1px solid var(--line);background:var(--sunk)}
.fpdf{display:flex;align-items:center;justify-content:center;font-weight:600;color:var(--late);text-decoration:none}
.fname{color:var(--ink);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.file .x{position:absolute;top:2px;right:2px;background:var(--surface);padding:0 6px}
.fmv{position:absolute;left:0;bottom:-2px;display:flex;gap:2px} .fmv button{padding:0 8px;font-size:18px;line-height:1}
.fadd{display:flex;align-items:center;justify-content:center;width:64px;height:80px;border:1px dashed var(--faint);border-radius:6px;font-size:12px;text-align:center;padding:6px;cursor:pointer;color:var(--accent)}
.cedit{background:var(--surface);border:1px solid var(--ink);border-radius:10px;padding:10px 12px;display:flex;flex-direction:column;gap:10px}
.cedit .ttl{font-weight:600}
.cedit .ttl span{font-family:var(--f-mono);font-weight:500;background:var(--sunk);border-radius:6px;padding:1px 6px;margin-right:6px}
.cgrid{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:8px}
@media (max-width:760px){.cgrid{grid-template-columns:repeat(2,minmax(0,1fr))}}
.term{display:flex;gap:4px}
.term input{width:60px}
.rem{display:flex;flex-direction:column;gap:4px}
.rem-row{display:flex;gap:8px;align-items:center;font-size:14px}
.rem-row input[type=checkbox]{width:auto}
.rem-row.done span{text-decoration:line-through;color:var(--faint)}
.fc{display:flex;flex-direction:column;gap:4px;font-size:13px}
.fc div{display:flex;gap:8px;flex-wrap:wrap}
.fc .mono{font-weight:500}
.tl{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:8px 10px;margin:4px 0 10px;display:flex;flex-direction:column;gap:3px}
.tl-scale{display:flex;justify-content:space-between;font-size:11px;color:var(--faint);margin-left:calc(min(38%,230px) + 8px);margin-right:52px}
.tl-row{display:grid;grid-template-columns:min(38%,230px) minmax(0,1fr) 44px;gap:8px;align-items:center;font-size:12px}
.tl-n{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:var(--muted)}
.tl-t{position:relative;height:14px;background:var(--sunk);border-radius:4px}
.tl-t i{position:absolute;top:2px;bottom:2px;border-radius:3px}
.tl-t em{position:absolute;left:4px;top:-1px;font-size:11px;color:var(--faint);font-style:normal}
.tl-today{position:absolute;top:-2px;bottom:-2px;width:2px;background:var(--ink);z-index:1}
.b-done{background:var(--ok)} .b-them{background:var(--accent)} .b-late{background:var(--late)} .b-fix{background:var(--fix)}
.b-plan{background:repeating-linear-gradient(90deg,var(--faint) 0 4px,transparent 4px 7px);opacity:.7}
.tl-d{font-size:11px;text-align:right}
[hidden]{display:none!important}
.gate{max-width:380px;margin:12vh auto 0;display:flex;flex-direction:column;gap:12px}
.gate .err{color:var(--late);font-size:13px;min-height:1em}
.ulist{display:flex;flex-direction:column;gap:6px}
.ulist .u{display:flex;gap:8px;align-items:center;justify-content:space-between;border-bottom:1px solid var(--line);padding:4px 0}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.row.end{justify-content:space-between}
.confirm{background:var(--late-bg);color:var(--late);border-radius:8px;padding:8px 10px;display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.legend{display:flex;flex-wrap:wrap;gap:6px;font-size:12px;color:var(--muted)}
.hint{font-size:12px;color:var(--faint)}
@media (prefers-reduced-motion:reduce){*{transition:none!important;scroll-behavior:auto!important}}
</style>

<div class="gate panel" id="gate">
  <h1>ProjectTrack</h1>
  <div id="needLink" hidden>Отвори линка, който ти е изпратен.</div>
  <form id="nameForm" class="gate" style="margin:0" hidden>
    <label class="f">Твоето име<input id="nmName" type="text" autocomplete="name" required></label>
    <button class="primary" type="submit">Влез</button>
  </form>
  <form id="setupForm" class="gate" style="margin:0" hidden>
    <h2>Първа настройка</h2>
    <label class="f">Твоето име<input id="suName" type="text" autocomplete="username" required></label>
    <label class="f">Ключ от GitHub<input id="suData" type="password" autocomplete="off" required></label>
    <button class="primary" type="submit">Запиши</button>
  </form>
  <div class="err" id="gateErr"></div>
</div>
<div class="wrap" id="app" hidden>
  <div class="top">
    <div><h1>ProjectTrack</h1><div class="today" id="today"></div></div>
    <div class="right">
      <input id="search" type="search" placeholder="Търси клиент, УПИ, село" aria-label="Търсене">
      <button data-view="people">Инженери</button>
      <button id="add" class="primary">+ Нов проект</button>
      <button id="installBtn" class="primary" hidden>Инсталирай</button>
      <button id="usersBtn" data-view="users" hidden>Входове</button>
      <button id="logout" class="ghost" title="Изход"><span id="whoName"></span> · Изход</button>
    </div>
  </div>
  <div id="banner" class="banner" hidden></div>
  <section id="v-users" class="view panel" hidden><div class="row end"><h2>Входове</h2><button data-view="main">Затвори</button></div>

function normalize(p){

    if(!Array.isArray(s.after))s.after=t?t.after.slice():[];
    if(t&&t.specs)s.specs=true;

    p.docs=p.docs.filter(d=>{const to=MOVED_TO_COMMON[d.name];if(!to)return true;
      const c=p.common.find(x=>x.name===to),first=d.by&&Object.values(d.by).find(Boolean);if(c&&first)Object.assign(c,first);return false})}
  {const sk=p.common.findIndex(x=>x.name==="Скица от кадастъра"),vi=p.common.findIndex(x=>x.name==="Виза за проектиране");
    if(sk>=0&&vi>=0){const a=p.common[sk],b=p.common[vi],rank={no:0,asked:1,copy:2,orig:3};const best=(rank[b.have]||0)>(rank[a.have]||0)?b:a;

}
function stepFromTemplate(t){return{key:t.key,name:t.name,from:t.from||"",term:t.term?{...t.term}:null,pv:!!t.pv,after:t.after.slice(),specs:!!t.specs,by:{}}}
function plotKeys(p){return p.plots&&p.plots.length?p.plots:[""]}
function plotLabel(k){return k||"имот"}
const EMPTY_CELL={state:"not",date:"",reg:"",ans:"",note:"",remarks:[]};
function cellOf(s,k){return(s.by&&s.by[k])||EMPTY_CELL}
function ensureCell(s,k){s.by=s.by||{};if(!s.by[k])s.by[k]=JSON.parse(JSON.stringify(EMPTY_CELL));return s.by[k]}
function stepByKey(p,key){return p.steps.find(s=>s.key===key)}

function blockers(p,s,k){

/* status of one step for one plot: done | fix | late | soon | wait | go | not | skip */
function status(p,s,k,today){
  if(skipped(p,s,k))return"skip";
  const c=cellOf(s,k);
  if(c.state==="done")return"done";
  if(c.state==="remarks")return"fix";
  if(c.state==="not")return blockers(p,s,k).length?"not":"go";

  if(due&&daysBetween(today,due)<=7)return"soon";

/* forecast: when a step should end for a plot; null = cannot tell (a term is missing) */
function endDate(p,s,k,today,depth){
  if((depth||0)>20)return null;
  const pre=(s.after||[]).map(a=>stepByKey(p,a)).filter(Boolean).map(t=>endDate(p,t,k,today,(depth||0)+1));
  const c=cellOf(s,k);
  if(skipped(p,s,k))return pre.some(x=>x===null)?null:maxDate([today,...pre]);
  if(c.state==="done")return c.ans||addTerm(c.date,s.term)||c.date||today;
  if(c.state==="filed"||c.state==="waiting"){const d=addTerm(c.date,s.term);return d?maxDate([d,today]):null}
  if(c.state==="remarks"){const d=addTerm(c.date,s.term);return maxDate([d||today,today])}
  if(pre.some(x=>x===null))return null;
  const start=c.date||maxDate([today,...pre]);
  return addTerm(start,s.term);
}
function missingTerms(p,s,k,acc,depth){
  acc=acc||new Set();if((depth||0)>20)return acc;
  if(isDone(p,s,k))return acc;
  if(!(s.term&&s.term.n>0))acc.add(s.name);
  (s.after||[]).map(a=>stepByKey(p,a)).filter(Boolean).forEach(t=>missingTerms(p,t,k,acc,(depth||0)+1));
  return acc;
}
function startOf(p,s,k,today){
  const c=cellOf(s,k);if(c.date)return c.date;

  if(pre.some(x=>x===null))return null;
  return maxDate([today,...pre]);

/* one bar per step for one plot: real time while filed (filed -> answer), forecast for what is not filed yet */
function timeline(p,k,today){
  const rows=p.steps.filter(s=>!skipped(p,s,k)).map(s=>{const st=status(p,s,k,today);const a=startOf(p,s,k,today),b=endDate(p,s,k,today);return{s,st,a,b}});
  const known=rows.filter(r=>r.a&&r.b);
  if(!known.length)return`<div class="hint">Няма достатъчно дати за график.</div>`;
  const lo=[...known.map(r=>r.a),today].reduce((m,x)=>x<m?x:m), hi=maxDate([...known.map(r=>r.b),today]);
  const span=Math.max(1,daysBetween(lo,hi)), x=d=>(daysBetween(lo,d)/span*100).toFixed(2);
  let h=`<div class="tl"><div class="tl-scale"><span>${bg(lo)}</span><span>${bg(hi)}</span></div>`;
  rows.forEach(r=>{
    const cls=r.st==="done"?"b-done":r.st==="late"?"b-late":(r.st==="wait"||r.st==="soon")?"b-them":r.st==="fix"?"b-fix":"b-plan";
    const bar=r.a&&r.b?`<i class="${cls}" style="left:${x(r.a)}%;width:${Math.max(1.5,x(r.b)-x(r.a))}%" title="${bg(r.a)} – ${bg(r.b)}"></i>`:`<em>няма срок</em>`;
    h+=`<div class="tl-row"><span class="tl-n">${esc(r.s.name.replace(" (копия, през надзора)",""))}</span><div class="tl-t"><b class="tl-today" style="left:${x(today)}%"></b>${bar}</div><span class="tl-d mono">${r.b?bgShort(r.b):"?"}</span></div>`});
  return h+`<div class="legend" style="margin-top:4px"><span class="pill p-ok">готово</span><span class="pill p-wait">подадено, чакаме</span><span class="pill p-late">закъснява</span><span class="pill p-fix">поправяме забележки</span><span class="pill p-not">план</span><span class="hint">черната черта е днес</span></div></div>`;
}
function forecast(p,k,today){
  const sup=stepByKey(p,"permit")||stepByKey(p,"supervisor");
  if(!sup)return null;
  if(isDone(p,sup,k))return{done:true,date:cellOf(sup,k).ans,what:sup.key};
  const d=endDate(p,sup,k,today);
  const miss=d?[]:[...missingTerms(p,sup,k)];
  const specsLeft=specsLeftCount(p,k);
  return{date:d,miss,specsLeft};
}

/* a phone photo of a document (3-8 MB) is cut to 3000 px on the long side (about 250 dpi on A4, a scanner's
   quality) as JPEG 0.9 - documents must stay readable (his word 2026-11-11) */
async function shrink(file){
  if(!/^image\/(jpeg|png|webp)$/.test(file.type)||file.size<2*1024*1024||!window.createImageBitmap)return file;
  try{const bm=await createImageBitmap(file,{imageOrientation:"from-image"});const sc=Math.min(1,3000/Math.max(bm.width,bm.height));
    const c=document.createElement("canvas");c.width=Math.round(bm.width*sc);c.height=Math.round(bm.height*sc);
    const g=c.getContext("2d");g.fillStyle="#fff";g.fillRect(0,0,c.width,c.height);g.drawImage(bm,0,0,c.width,c.height);bm.close&&bm.close();
    const b=await new Promise(r=>c.toBlob(r,"image/jpeg",0.9));if(!b||b.size>=file.size)return file;
    return new File([b],file.name.replace(/\.[^.]+$/,"")+".jpg",{type:"image/jpeg"});
  }catch(e){return file}
}

      tg.files=tg.files||[];tg.files.push({id:r.id,n:file.name,t:r.contentType||file.type,s:r.sizeBytes||file.size,d:todayStr()});saveSoon(id)}

/* ---------- GitHub: the page lives on GitHub Pages, the data in a PRIVATE repo ----------

   admins[] = admin link secret -> {K, page-repo token}. The device keeps only the link secret and
   the name (localStorage); tokens are unsealed on every open and kept in memory. */
const GH_OWNER="nikolovarch01-cmd", PAGE_REPO="ProjectTrack", DATA_REPO="ProjectTrack-data", BR="main", API="https://api.github.com";
const SESS="pt_device_v1";
const devGet=()=>{try{return JSON.parse(localStorage.getItem(SESS)||"null")}catch(e){return null}};

/* logins are links (his word 2026-11-11: no passwords). One common link for the colleagues (#t=<secret>):
   the first open asks the name, the device remembers it and is recorded in devices/<id>.json, so each person

   Secrets are random, so no stretching is needed. */
const LINK_IT=1000;

async function pageKeyOf(pageTok){return aesKey(new Uint8Array(await crypto.subtle.digest("SHA-256",te.encode("pt-links|"+pageTok))))}

async function makeTeam(kRaw,pageTok){const secret=rnd(18);
  return{...await wrapFor(secret,{k:u8b64(kRaw)}),adm:await seal(await pageKeyOf(pageTok),{secret})}}
async function makeAdmin(name,kRaw,pageTok){const id="a"+rnd(6),secret=rnd(18);

const base=()=>location.origin+location.pathname;
const teamLink=s=>base()+"#t="+s, adminLink=(id,s)=>base()+"#a="+id+"."+s;

function gh(path,opt={},tok){

function ghErr(r,what){const e=new Error(what+" "+r.status);e.code="GitHub "+r.status;e.status=r.status;return e}

async function loadUsers(){
  usersDoc=null;usersSha=null;
  const r=await gh(`/repos/${GH_OWNER}/${PAGE_REPO}/contents/users.json?ref=${BR}`);
  if(r.ok){const j=await r.json();usersSha=j.sha;usersDoc=JSON.parse(td.decode(b64u8(j.content.replace(/\s/g,""))));return}
  if(r.status===404){return}

  const c=await fetch("users.json?t="+Date.now(),{cache:"no-store"}).catch(()=>null);

async function saveUsers(doc,pageTok){

  if(usersSha)body.sha=usersSha;

/* all writes to the data repo go one after another: each one is a commit on the same branch */
let wq=Promise.resolve();
function queue(fn){const p=wq.catch(()=>{}).then(fn);wq=p;return p}
const dpath=p=>`/repos/${GH_OWNER}/${DATA_REPO}/contents/${p.split("/").map(encodeURIComponent).join("/")}`;
async function putFile(path,b64,msg){
  for(let tries=0;;tries++){
    const body={message:msg,branch:BR,content:b64};if(shas[path])body.sha=shas[path];
    const r=await gh(dpath(path),{method:"PUT",body:JSON.stringify(body)},session.data);
    if(r.ok){shas[path]=(await r.json()).content.sha;wroteAt[path]=Date.now();cacheSave();return}
    if((r.status===409||r.status===422)&&tries<3){const g=await gh(dpath(path)+"?ref="+BR,{cache:"no-store"},session.data);
      if(g.ok)shas[path]=(await g.json()).sha;else if(g.status===404)delete shas[path];continue}

async function delFile(path,msg){
  for(let tries=0;;tries++){

    if(r.ok||r.status===404){delete shas[path];wroteAt[path]=Date.now();return}

const jsonB64=o=>u8b64(te.encode(JSON.stringify(o,null,1)));
const who=()=>session?session.name:"";
const newId=pre=>pre+Date.now().toString(36)+Math.random().toString(36).slice(2,6);

/* read: one tree request, then only the files whose content changed */
let pulling=false, pullTimer=null, firstPull=true;
async function pull(){
  if(pulling||!session)return;pulling=true;
  try{
    const r=await gh(`/repos/${GH_OWNER}/${DATA_REPO}/git/trees/${BR}?recursive=1`,{},session.data);
    if(r.status===401||r.status===403&&r.headers.get("x-ratelimit-remaining")!=="0"){showBanner("Ключът за данните не важи. Влез пак или поискай нов вход.");return}
    let tree=[];
    if(r.ok)tree=(await r.json()).tree||[];
    else if(r.status!==404&&r.status!==409)throw ghErr(r,"tree");
    const seen=new Set(), nextP={...projects}, nextE={...people}, nextD={...devices};let changed=false;
    const mapOf=k=>k==="projects"?nextP:k==="people"?nextE:nextD;
    const jobs=[];
    for(const t of tree){
      if(t.type!=="blob")continue;seen.add(t.path);
      const m=t.path.match(/^(projects|people|devices)\/([^/]+)\.json$/);
      if(!m){shas[t.path]=shas[t.path]||t.sha;continue}
      if(m[1]==="devices"&&wroteAt[t.path]&&nextD[m[2]]){shas[t.path]=shas[t.path]||t.sha;continue}
      if(shas[t.path]===t.sha&&mapOf(m[1])[m[2]])continue;
      if(wroteAt[t.path]&&Date.now()-wroteAt[t.path]<90000)continue; /* our own write may not show in the tree yet */
      jobs.push({t,m});
    }
    /* all changed files at once, not one after another */
    await Promise.all(jobs.map(async({t,m})=>{
      const b=await gh(`/repos/${GH_OWNER}/${DATA_REPO}/git/blobs/${t.sha}`,{cache:"default",headers:{"Accept":"application/vnd.github.raw+json"}},session.data);
      if(!b.ok)return;
      const data=JSON.parse(td.decode(new Uint8Array(await b.arrayBuffer())));
      shas[t.path]=t.sha;changed=true;
      if(m[1]==="projects"){if(!dirty.has(m[2]))nextP[m[2]]=normalize(data)}else mapOf(m[1])[m[2]]=data;
    }));
    for(const id of Object.keys(nextD)){const p="devices/"+id+".json";if(!seen.has(p)&&shas[p]&&!(wroteAt[p]&&Date.now()-wroteAt[p]<90000)){delete nextD[id];delete shas[p]}}
    devices=nextD;if(view==="users")renderUsers();
    for(const id of Object.keys(nextP)){const p="projects/"+id+".json";if(!seen.has(p)&&!dirty.has(id)&&shas[p]&&!(wroteAt[p]&&Date.now()-wroteAt[p]<90000)){delete nextP[id];delete shas[p];changed=true}}
    for(const id of Object.keys(nextE)){const p="people/"+id+".json";if(!seen.has(p)&&shas[p]&&!(wroteAt[p]&&Date.now()-wroteAt[p]<90000)){delete nextE[id];delete shas[p];changed=true}}
    if(changed||firstPull){if(firstPull)perf.net=Math.round(performance.now());projects=nextP;people=nextE;ready=true;firstPull=false;renderSoon();cacheSave()}
    hideBanner();
  }catch(e){ready=true;showBanner("Няма връзка с данните ("+esc(e.code||"мрежа")+"). Страницата ще опитва сама.");renderSoon()}

/* attached files: in the data repo under files/, shown through blob URLs (the repo is private) */
async function fetchBlob(path,type){
  if(blobUrl[path])return blobUrl[path];
  if(!blobBusy[path])blobBusy[path]=(async()=>{
    const r=await gh(dpath(path)+"?ref="+BR,{cache:"default",headers:{"Accept":"application/vnd.github.raw+json"}},session.data);

/* the device is written once a day into devices/<id>.json: who, phone or computer, first and last day */

    let cur=null;if(g.ok){const j=await g.json();shas[path]=j.sha;cur=JSON.parse(td.decode(b64u8(j.content.replace(/\s/g,""))))}

/* overall status of one plot: where the project is in its whole path */
function phase(p,k,today){
  const st=key=>{const s=stepByKey(p,key);return s?cellOf(s,k).state:"not"};
  const late=p.steps.some(s=>status(p,s,k,today)==="late");
  const red=c=>late?"p-late":c;
  if(st("permit_force")==="done")return{text:"Разрешение в сила",cls:"p-ok"};
  if(st("permit")==="done")return{text:"Разрешение издадено",cls:"p-ok"};
  if(["filed","waiting","remarks"].includes(st("permit")))return{text:"Внесен за разрешение",cls:red("p-wait")};
  if(st("supervisor")==="remarks")return{text:"Надзор — забележки",cls:"p-fix"};
  if(["filed","waiting"].includes(st("supervisor")))return{text:"При надзора",cls:red("p-wait")};
  if(st("supervisor")==="done")return{text:"Готов за внасяне",cls:"p-go"};
  if(p.steps.some(s=>!["supervisor","permit","permit_force"].includes(s.key)&&!skipped(p,s,k)&&cellOf(s,k).state!=="not"))return{text:"Съгласуване",cls:red("p-wait")};
  const a=archOf(p,k);
  return{text:"Проектиране — "+ARCH_TEXT[a.stage||"not"].toLowerCase(),cls:"p-not"};
}

  if(c.state==="remarks"&&canWrite){const left=(c.remarks||[]).filter(x=>rs(x)==="open").length;
    h+=`<div class="row"><button class="primary" data-resubmit="1">Пусни отново (кръг ${(c.round||1)+1})</button><span class="hint">${left?left+" забележки още не са оправени":"всички забележки са оправени"}</span></div>`}
  if(c.history&&c.history.length)h+=`<div class="rem"><span style="font-size:12px;color:var(--muted)">Предишни кръгове</span>${c.history.map((x,i)=>`<div class="hint">Кръг ${i+1}: пусната ${bg(x.date)}${x.reg?", вх. № "+esc(x.reg):""}${x.ans?", отговор "+bg(x.ans):""}${x.remarks&&x.remarks.length?", "+x.remarks.length+" забележки":""}</div>`).join("")}</div>`;
  h+=`<div class="row end"><span class="hint">${c.round>1?"Сега е кръг "+c.round+".":""}</span><button class="ghost" data-selclose="1">Затвори</button></div></div>`;
  return h;
}

/* ---------- events ---------- */
function targetSpec(el){const ce=el.closest(".cedit");if(!ce)return null;
  if(ce.dataset.common!==undefined)return{common:+ce.dataset.common};
  return ce.dataset.doc!==undefined?{doc:+ce.dataset.doc,k:ce.dataset.k}:{key:ce.dataset.key,k:ce.dataset.k}}
function resolveTarget(p,sp){
  if(!sp)return null;const k=sp.k;
  if(sp.common!==undefined)return(p.common||[])[sp.common]||null;
  if(sp.doc!==undefined){const d=p.docs[sp.doc];if(!d)return null;d.by=d.by||{};return d.by[k]=d.by[k]||{have:"no",where:"",date:"",note:""}}
  const s=stepByKey(p,sp.key);return s?ensureCell(s,k):null;
}
function fileTarget(p,el){return resolveTarget(p,targetSpec(el))}
function renamePlotKey(p,from,to){
  (p.docs||[]).forEach(s=>{if(s.by&&s.by[from]!==undefined){s.by[to]=s.by[from];delete s.by[from]}});
  if(p.plotInfo&&p.plotInfo[from]!==undefined){p.plotInfo[to]=p.plotInfo[from];delete p.plotInfo[from]}
  if(p.arch&&p.arch[from]!==undefined){p.arch[to]=p.arch[from];delete p.arch[from]}
  p.specs.forEach(s=>{if(s.by&&s.by[from]!==undefined){s.by[to]=s.by[from];delete s.by[from]}});
  p.steps.forEach(s=>{if(s.by&&s.by[from]!==undefined){s.by[to]=s.by[from];delete s.by[from]}});
  if(p.pvBy&&p.pvBy[from]!==undefined){p.pvBy[to]=p.pvBy[from];delete p.pvBy[from]}
}
document.addEventListener("click",e=>{
  if(e.target.closest("a,input,select,label"))return;

  if(t.dataset.pdel){if(!canWrite)return;const pid=t.dataset.pdel;if(confirmPerson!==pid){confirmPerson=pid;renderPeople();return}
    confirmPerson=null;delete people[pid];peopleStore.del(pid).catch(()=>{});render();return}
  if(t.dataset.goto){const[id,key,k]=t.dataset.goto.split("|");open=id;sel=key?{id,key,k}:null;view="main";try{localStorage.setItem("pt_view",view)}catch(_){}render();const c=document.getElementById("c-"+id);const ce=c&&c.querySelector(".cedit");(ce||c)&&(ce||c).scrollIntoView({behavior:"smooth",block:"center"});return}
  if(t.dataset.toggle){open=open===t.dataset.toggle?null:t.dataset.toggle;confirmDel=null;confirmPlot=null;sel=null;render();return}
  if(t.id==="add"){if(!canWrite)return;const id=store.newId();projects[id]=newProject();open=id;sel=null;filter="all";query="";$("#search").value="";flush(id);render();

  const ed=t.closest(".ed");if(!ed)return;

  if(t.dataset.sel){const[key,k]=t.dataset.sel.split("|");sel=sel&&sel.key===key&&sel.k===k?null:{id,key,k};render();return}
  if(t.dataset.selclose){sel=null;render();return}
  if(t.dataset.csel){const i=+t.dataset.csel;csel=csel&&csel.id===id&&csel.i===i?null:{id,i};render();return}
  if(t.dataset.cclose){csel=null;render();return}
  if(t.dataset.dsel){const[i,k]=t.dataset.dsel.split("|");dsel=dsel&&dsel.i===+i&&dsel.k===k?null:{id,i:+i,k};render();return}
  if(t.dataset.dclose){dsel=null;render();return}
  if(!canWrite)return;
  if(t.dataset.fmove){const[i,d]=t.dataset.fmove.split("|").map(Number);const tg=fileTarget(p,t);if(!tg||!tg.files)return;const j=i+d;if(j<0||j>=tg.files.length)return;
    [tg.files[i],tg.files[j]]=[tg.files[j],tg.files[i]];saveSoon(id);render();return}
  if(t.dataset.fdel!==undefined){
    if(t.dataset.armed!=="1"){t.dataset.armed="1";t.textContent="махни?";return}
    const tg=fileTarget(p,t);if(!tg||!tg.files)return;const f=tg.files.splice(+t.dataset.fdel,1)[0];saveSoon(id);render();
    if(f&&assetsNs)assetsNs.delete(f.id).catch(()=>{});return}
  if(t.dataset.dwhere){const ce=t.closest(".cedit");const d=p.docs[+ce.dataset.doc],k=ce.dataset.k;d.by=d.by||{};const c=d.by[k]=d.by[k]||{have:"no",where:"",date:"",note:""};
    c.where=t.dataset.dwhere;if(!c.date)c.date=todayStr();if(c.have==="no")c.have="orig";logIt(p,k,d.name+": "+c.where);saveSoon(id);render();return}
  if(t.dataset.addcommon){const i=document.getElementById("nc-"+id);const v=i.value.trim();if(v){p.common=p.common||[];p.common.push({name:v,have:"no",where:"",date:"",note:""});csel={id,i:p.common.length-1};saveSoon(id);i.value="";render()}return}
  if(t.dataset.delcommon!==undefined){if(t.dataset.armed!=="1"){t.dataset.armed="1";t.textContent="махни?";return}
    p.common.splice(+t.dataset.delcommon,1);csel=null;saveSoon(id);render();return}
  if(t.dataset.cwhere){const c=p.common[+t.closest(".cedit").dataset.common];if(!c)return;c.where=t.dataset.cwhere;if(!c.date)c.date=todayStr();if((c.have||"no")==="no")c.have="orig";
    logIt(p,"",c.name+": "+c.where);saveSoon(id);render();return}
  if(t.dataset.adddoc){const i=document.getElementById("nd-"+id);const v=i.value.trim();if(v){p.docs.push({name:v,by:{}});saveSoon(id);i.value="";render()}return}
  if(t.dataset.deldoc!==undefined){p.docs.splice(+t.dataset.deldoc,1);dsel=null;saveSoon(id);render();return}
  if(t.dataset.cell!==undefined){const s=p.specs[+t.dataset.cell];if(!s)return;s.by=s.by||{};const k=t.dataset.plot;const nv=CELL_NEXT[s.by[k]||"not"];if(nv==="not")delete s.by[k];else s.by[k]=nv;logIt(p,k,s.name+": "+SPEC_TEXT[nv]);saveSoon(id);render()}
  else if(t.dataset.delspec){p.specs.splice(+t.dataset.delspec,1);saveSoon(id);render()}
  else if(t.dataset.addspec){const i=document.getElementById("ns-"+id);const v=i.value.trim();if(v){p.specs.push({name:v,by:{}});saveSoon(id);i.value="";render()}}
  else if(t.dataset.quickstep){const x=EXTRA_STEPS.find(y=>y.key===t.dataset.quickstep);if(x&&!stepByKey(p,x.key)){const si=p.steps.findIndex(s=>s.key==="supervisor");const st=stepFromTemplate(x);
    p.steps.splice(si<0?p.steps.length:si,0,st);const sup=stepByKey(p,"supervisor");if(sup&&!sup.after.includes(x.key))sup.after.push(x.key);saveSoon(id);render()}}
  else if(t.dataset.quickspec){p.specs.push({name:t.dataset.quickspec,by:{}});saveSoon(id);render()}
  else if(t.dataset.addplot){const i=document.getElementById("np-"+id);const v=i.value.trim();if(v&&!p.plots.includes(v)){
    if(!p.plots.length)renamePlotKey(p,"",v);p.plots.push(v);saveSoon(id);i.value="";render()}}
  else if(t.dataset.delplot!==undefined){const k=t.dataset.delplot;
    if(confirmPlot!==id+"|"+k){confirmPlot=id+"|"+k;render();return}
    confirmPlot=null;p.plots=p.plots.filter(x=>x!==k);p.specs.forEach(s=>{if(s.by)delete s.by[k]});p.steps.forEach(s=>{if(s.by)delete s.by[k]});(p.docs||[]).forEach(s=>{if(s.by)delete s.by[k]});if(p.pvBy)delete p.pvBy[k];
    if(!p.plots.length)renamePlotKey(p,k,"");saveSoon(id);render()}
  else if(t.dataset.addstep){const i=document.getElementById("nst-"+id);const v=i.value.trim();if(v){p.steps.push({key:"x"+Date.now().toString(36),name:v,from:"",term:null,pv:false,after:[],by:{}});saveSoon(id);i.value="";render()}}
  else if(t.dataset.radd||t.dataset.rdel!==undefined||t.dataset.rcycle!==undefined||t.dataset.resubmit){const ce=t.closest(".cedit");const s=stepByKey(p,ce.dataset.key),k=ce.dataset.k,c=ensureCell(s,k);c.remarks=c.remarks||[];
    if(t.dataset.radd){const i=ce.querySelector("input[id^=ra-]");const v=i.value.trim();if(!v)return;c.remarks.push({t:v,s:"open"});if(c.state==="filed"||c.state==="waiting")c.state="remarks";i.value="";logIt(p,k,s.name+": забележка — "+v)}
    else if(t.dataset.rcycle!==undefined){const r=c.remarks[+t.dataset.rcycle];r.s=REM_NEXT[rs(r)];delete r.d}
    else if(t.dataset.resubmit){c.history=c.history||[];c.history.push({date:c.date,reg:c.reg,ans:c.ans||todayStr(),remarks:c.remarks.slice()});
      c.round=(c.round||1)+1;c.date=todayStr();c.reg="";c.ans="";c.state="filed";c.remarks=c.remarks.filter(r=>rs(r)==="open");logIt(p,k,s.name+": подадено отново, кръг "+c.round)}    else c.remarks.splice(+t.dataset.rdel,1);
    saveSoon(id);render()}
  else if(t.dataset.logadd){const i=document.getElementById("lg-"+id);const v=i.value.trim();if(v){p.log=p.log||[];p.log.push({d:todayStr(),t:v});saveSoon(id);i.value="";render()}}
  else if(t.dataset.del){confirmDel=id;render()}
  else if(t.dataset.delno){confirmDel=null;render()}
  else if(t.dataset.delyes){delete projects[id];dirty.delete(id);clearTimeout(timers[id]);confirmDel=null;open=null;sel=null;store.del(id).catch(()=>showBanner("Изтриването не мина. Опитай пак."));render()}
});
document.addEventListener("keydown",e=>{const t=e.target;if((e.key==="Enter"||e.key===" ")&&t.dataset&&t.dataset.toggle){e.preventDefault();t.click()}
  if(e.key==="Enter"&&t.id&&/^(ns|nst|np|ra|lg)-/.test(t.id)){e.preventDefault();const b=t.parentElement.querySelector("button");if(b)b.click()}});
function onField(e){
  const t=e.target;const ed=t.closest&&t.closest(".ed");if(!ed||!canWrite)return;
  const id=ed.dataset.id,p=projects[id];if(!p)return;
  if(t.dataset.f){p[t.dataset.f]=t.type==="checkbox"?t.checked:t.value;saveSoon(id);if(t.type==="checkbox")render();else renderSummary();return}
  if(t.dataset.fup){const sp=targetSpec(t);if(sp&&t.files&&t.files.length)uploadFiles([...t.files],sp,id);t.value="";return}
  if(t.dataset.capp){const[key,k]=t.dataset.capp.split("|");const st=stepByKey(p,key);if(!st)return;const c=ensureCell(st,k);
    if(t.checked){c.state="done";if(!c.ans)c.ans=todayStr()}else{c.state=c.date?"waiting":"not";c.ans=""}
    logIt(p,k,st.name+": "+(t.checked?"съгласувана":"отворена отново"));saveSoon(id);render();return}
  if(t.dataset.cc){const c=p.common[+t.closest(".cedit").dataset.common];if(!c)return;c[t.dataset.cc]=t.value;
    if(t.dataset.cc==="have")logIt(p,"",c.name+": "+HAVE_TEXT[t.value]);saveSoon(id);if(t.tagName==="SELECT"||t.type==="date")render();else renderSummary();return}
  if(t.dataset.dc){const ce=t.closest(".cedit");const d=p.docs[+ce.dataset.doc],k=ce.dataset.k;if(!d)return;d.by=d.by||{};const c=d.by[k]=d.by[k]||{have:"no",where:"",date:"",note:""};
    c[t.dataset.dc]=t.value;if(t.dataset.dc==="have")logIt(p,k,d.name+": "+HAVE_TEXT[t.value]);saveSoon(id);if(t.tagName==="SELECT"||t.type==="date")render();else renderSummary();return}
  if(t.dataset.si!==undefined){const s=p.specs[+t.dataset.si];if(!s)return;
    if(t.dataset.sk==="eng"&&t.value==="__new"){view="people";try{localStorage.setItem("pt_view",view)}catch(_){}render();const i=document.getElementById("nps");if(i)i.value=s.name;const n=document.getElementById("npn");if(n)n.focus();return}
    s[t.dataset.sk]=t.value;
    if(t.dataset.sk==="sent"&&t.value){plotKeys(p).forEach(k=>{s.by=s.by||{};if(!s.by[k])s.by[k]="sent"});logIt(p,"",s.name+": подадена към инженера")}
    if(t.dataset.sk==="due"&&t.value)logIt(p,"",s.name+": срок от инженера "+bgShort(t.value));
    if(t.dataset.sk==="eng"&&t.value)logIt(p,"",s.name+": инженер "+personName(t.value));
    saveSoon(id);if(t.type==="date"||t.tagName==="SELECT")render();else renderSummary();return}
  if(t.dataset.ak){const ac=t.closest("[data-arch]");const k=ac.dataset.arch;p.arch=p.arch||{};const a=p.arch[k]=p.arch[k]||{stage:"not",wait:"",what:"",since:"",note:""};
    a[t.dataset.ak]=t.value;if(t.dataset.ak==="wait"&&t.value&&!a.since)a.since=todayStr();if(t.dataset.ak==="wait"&&!t.value)a.since="";
    if(t.dataset.ak==="stage")logIt(p,k,"Архитектура: "+ARCH_TEXT[t.value]);
    if(t.dataset.ak==="wait")logIt(p,k,"Архитектура: чакаме "+((ARCH_WAIT.find(x=>x[0]===t.value)||["",""])[1]));
    saveSoon(id);if(t.type==="text")renderSummary();else render();return}
  if(t.dataset.pi){const k=t.closest("[data-plotk]").dataset.plotk;p.plotInfo=p.plotInfo||{};const pi=p.plotInfo[k]=p.plotInfo[k]||{};pi[t.dataset.pi]=t.value;saveSoon(id);renderSummary();return}
  if(t.dataset.pv!==undefined){p.pvBy=p.pvBy||{};if(t.checked)p.pvBy[t.dataset.pv]=true;else delete p.pvBy[t.dataset.pv];saveSoon(id);render();return}
  const ce=t.closest(".cedit");if(!ce)return;
  const s=stepByKey(p,ce.dataset.key),k=ce.dataset.k;if(!s)return;
  if(t.dataset.term){
    if(t.dataset.term==="n"){const n=parseInt(t.value,10);s.term=n>0?{n,u:(s.term&&s.term.u)||"w"}:null}
    else s.term={n:(s.term&&s.term.n)||1,u:t.value};
    saveSoon(id);if(t.type!=="number")render();else renderSummary();return}
  if(t.dataset.rdone!==undefined){const c=ensureCell(s,k);c.remarks[+t.dataset.rdone].d=t.checked;saveSoon(id);render();return}
  if(t.dataset.c){const c=ensureCell(s,k),f=t.dataset.c;c[f]=t.value;
    if(f==="date"&&t.value&&c.state==="not")c.state="filed";
    if(f==="ans"&&t.value&&c.state!=="remarks")c.state="done";
    if(f==="state"&&t.value==="done"&&!c.ans)c.ans=todayStr();
    if(f==="state"||f==="date"||f==="ans")logIt(p,k,s.name+": "+((STATES.find(x=>x[0]===c.state)||["",""])[1]).toLowerCase()+(f==="ans"&&t.value?" (отговор "+bgShort(t.value)+")":""));
    saveSoon(id);
    if(f==="note"||f==="reg")renderSummary();else render();
  }
}

if("serviceWorker" in navigator){navigator.serviceWorker.register("sw.js").catch(()=>{});
  /* a newer page arrived behind the quick copy: take it at once, but only right after opening and with nothing unsaved */
  navigator.serviceWorker.addEventListener("message",e=>{if(e.data&&e.data.type==="pt-updated"&&performance.now()<15000&&!typing()&&!uploading&&!dirty.size)location.reload()});
  /* with addEventListener the browser holds the worker's messages until this is called */
  navigator.serviceWorker.startMessages&&navigator.serviceWorker.startMessages()}
/* iPhone ignores "no zoom" in the viewport line - stop the pinch and double-tap zoom by hand */
if(window.matchMedia&&matchMedia("(pointer:coarse)").matches){
  ["gesturestart","gesturechange","gestureend"].forEach(t=>document.addEventListener(t,e=>e.preventDefault(),{passive:false}));
  document.addEventListener("touchmove",e=>{if(e.touches&&e.touches.length>1)e.preventDefault()},{passive:false});
  let lastTap=0;document.addEventListener("touchend",e=>{const n=Date.now();if(n-lastTap<300&&!e.target.closest("input,textarea,select"))e.preventDefault();lastTap=n},{passive:false});
}
